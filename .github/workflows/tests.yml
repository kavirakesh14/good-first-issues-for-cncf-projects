name: Python Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyyaml

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Validate workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".github/workflows").glob("*.yml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"Valid YAML: {path}")
          PY

      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.DOTALL)
          if not match:
              raise SystemExit("Could not find the dashboard script.")
          Path("/tmp/dashboard.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/dashboard.js

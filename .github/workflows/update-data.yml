name: Auto-Sync CNCF Good First Issues

on:
  schedule:
    # Runs every 6 hours (At minute 0 of every 6th hour)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to manually trigger the pipeline anytime from the GitHub UI

# Keep JavaScript actions on the supported Node.js runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Explicitly grant write access so the runner can push data.json back to the repo
permissions:
  contents: write

jobs:
  sync-ecosystem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Removed cache: 'pip' to fix the missing requirements.txt error

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Execute Auto-Discovery Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetcher.py

      - name: Validate Dashboard Data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          if not isinstance(data, dict) or not isinstance(data.get("issues"), list):
              raise SystemExit("data.json must be an object containing an issues list.")
          if not isinstance(data.get("last_updated"), str) or not data["last_updated"]:
              raise SystemExit("data.json is missing last_updated.")
          required = {"repo", "tier", "lang", "title", "url", "labels", "created_at", "ai_related"}
          issues = data["issues"]
          missing = [i for i, issue in enumerate(issues) if not isinstance(issue, dict) or not required.issubset(issue)]
          if missing:
              raise SystemExit(f"{len(missing)} issue records are missing required fields.")
          ai_count = sum(issue["ai_related"] is True for issue in issues)
          repo_count = len({issue["repo"] for issue in issues})
          print(f"Validated {len(issues)} issues across {repo_count} repositories; {ai_count} AI Native issues.")
          PY

      - name: Commit and Push Updated Data Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only stage, commit, and push if data.json actually changed
          git add data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: automated sync of CNCF issue database [skip ci]"
            git push origin main
          else
            echo "No database changes detected during this synchronization window."
          fi

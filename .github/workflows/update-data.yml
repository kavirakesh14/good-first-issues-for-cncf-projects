name: Auto-Sync CNCF Good First Issues

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  sync-ecosystem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Execute Auto-Discovery Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetcher.py

      - name: Commit and Push Updated Data Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json metadata.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: automated sync of CNCF issue database [skip ci]"
            git push origin main
          else
            echo "No database changes detected during this synchronization window."
          fi